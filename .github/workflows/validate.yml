name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill structure
        run: python scripts/check_skill.py

      - name: Validate example profile
        run: python scripts/validate_profile.py assets/profile-template.json

      - name: Validate profile validator
        run: python scripts/validate_profile.py --self-test
